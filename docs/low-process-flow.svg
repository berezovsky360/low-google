<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="1200" height="720" fill="#0b0b0c"/>

  <!-- Header -->
  <rect x="40" y="28" width="36" height="36" rx="9" fill="#0088ff"/>
  <rect x="48" y="38" width="20" height="16" rx="4" fill="#ffffff"/>
  <text x="90" y="52" fill="#f4f4f6" font-size="20" font-weight="700">LOW — Process Flow &amp; Use-Case Architecture (Google Cloud)</text>

  <!-- Column 1: Actors & Inputs -->
  <rect x="40" y="90" width="240" height="580" rx="16" fill="#121215" stroke="#222228"/>
  <text x="64" y="124" fill="#0088ff" font-size="13" font-weight="700">1. ACTORS &amp; CAPTURE</text>

  <rect x="60" y="148" width="200" height="72" rx="10" fill="#18181c" stroke="#27272f"/>
  <text x="76" y="176" fill="#f4f4f6" font-size="13" font-weight="600">Workspace Owner / Team</text>
  <text x="76" y="198" fill="#8e8e93" font-size="11">Markdown Vault &amp; Voice Notes</text>

  <rect x="60" y="244" width="200" height="72" rx="10" fill="#18181c" stroke="#27272f"/>
  <text x="76" y="272" fill="#f4f4f6" font-size="13" font-weight="600">Low-Code Builder Studio</text>
  <text x="76" y="294" fill="#8e8e93" font-size="11">Prompt + 16 Standard Components</text>

  <rect x="60" y="340" width="200" height="72" rx="10" fill="#18181c" stroke="#27272f"/>
  <text x="76" y="368" fill="#60a5fa" font-size="13" font-weight="600">Google Agents (MCP)</text>
  <text x="76" y="390" fill="#8e8e93" font-size="11">Antigravity · Gemini CLI · Vertex</text>

  <rect x="60" y="436" width="200" height="72" rx="10" fill="#18181c" stroke="#27272f"/>
  <text x="76" y="464" fill="#10b981" font-size="13" font-weight="600">External Guests</text>
  <text x="76" y="486" fill="#8e8e93" font-size="11">Public /share/[appId] Snapshot</text>

  <rect x="60" y="532" width="200" height="72" rx="10" fill="#18181c" stroke="#27272f"/>
  <text x="76" y="560" fill="#f4f4f6" font-size="13" font-weight="600">Google Gemini &amp; Vertex AI</text>
  <text x="76" y="582" fill="#8e8e93" font-size="11">Gemini 2.5 Flash · 2.5 Pro · 2.0</text>

  <!-- Column 2: Security & Governance Gate -->
  <rect x="330" y="90" width="250" height="580" rx="16" fill="#121215" stroke="#222228"/>
  <text x="354" y="124" fill="#0088ff" font-size="13" font-weight="700">2. SECURITY &amp; GOVERNANCE</text>

  <rect x="350" y="156" width="210" height="96" rx="10" fill="#18181c" stroke="#1e3a8a"/>
  <text x="366" y="186" fill="#93c5fd" font-size="13" font-weight="600">Google Cloud KMS + AES-GCM</text>
  <text x="366" y="208" fill="#8e8e93" font-size="11">Per-Org Wrapped DEK</text>
  <text x="366" y="226" fill="#8e8e93" font-size="11">AAD Bound: orgId/documentId</text>

  <rect x="350" y="280" width="210" height="96" rx="10" fill="#18181c" stroke="#27272f"/>
  <text x="366" y="310" fill="#f4f4f6" font-size="13" font-weight="600">Single-Use HMAC Approvals</text>
  <text x="366" y="332" fill="#8e8e93" font-size="11">Gates App Publish, Status</text>
  <text x="366" y="350" fill="#8e8e93" font-size="11">Transitions &amp; Archiving</text>

  <rect x="350" y="404" width="210" height="96" rx="10" fill="#18181c" stroke="#27272f"/>
  <text x="366" y="434" fill="#10b981" font-size="13" font-weight="600">6-Point Pre-Publish Audit</text>
  <text x="366" y="456" fill="#8e8e93" font-size="11">Strict Zod Schema (Zero-Eval)</text>
  <text x="366" y="474" fill="#8e8e93" font-size="11">UX/UI Contrast &amp; Mobile Check</text>

  <rect x="350" y="528" width="210" height="96" rx="10" fill="#18181c" stroke="#27272f"/>
  <text x="366" y="558" fill="#f4f4f6" font-size="13" font-weight="600">Dual Tenant Isolation</text>
  <text x="366" y="580" fill="#8e8e93" font-size="11">firestore.rules + Single Server</text>
  <text x="366" y="598" fill="#8e8e93" font-size="11">FirestoreRepository Module</text>

  <!-- Column 3: Core Cloud Run Services -->
  <rect x="630" y="90" width="250" height="580" rx="16" fill="#121215" stroke="#222228"/>
  <text x="654" y="124" fill="#0088ff" font-size="13" font-weight="700">3. CORE RUNTIME (CLOUD RUN)</text>

  <rect x="650" y="156" width="210" height="96" rx="10" fill="#18181c" stroke="#27272f"/>
  <text x="666" y="186" fill="#f4f4f6" font-size="13" font-weight="600">Markdown Source of Truth</text>
  <text x="666" y="208" fill="#8e8e93" font-size="11">Encrypted Vault Files &amp; App</text>
  <text x="666" y="226" fill="#8e8e93" font-size="11">Records with YAML Frontmatter</text>

  <rect x="650" y="280" width="210" height="96" rx="10" fill="#18181c" stroke="#27272f"/>
  <text x="666" y="310" fill="#60a5fa" font-size="13" font-weight="600">Grounded Memory Service</text>
  <text x="666" y="332" fill="#8e8e93" font-size="11">Paragraph Chunks + Vector Index</text>
  <text x="666" y="350" fill="#8e8e93" font-size="11">Rebuildable via rebuild-derived</text>

  <rect x="650" y="404" width="210" height="96" rx="10" fill="#18181c" stroke="#27272f"/>
  <text x="666" y="434" fill="#f4f4f6" font-size="13" font-weight="600">Deterministic App Studio</text>
  <text x="666" y="456" fill="#8e8e93" font-size="11">Metric · Kanban · Table · Form</text>
  <text x="666" y="474" fill="#8e8e93" font-size="11">Calendar · Embedded Agent Chat</text>

  <rect x="650" y="528" width="210" height="96" rx="10" fill="#18181c" stroke="#27272f"/>
  <text x="666" y="558" fill="#f4f4f6" font-size="13" font-weight="600">Automation Worker &amp; Audit</text>
  <text x="666" y="580" fill="#8e8e93" font-size="11">Idempotent Digest Workflows</text>
  <text x="666" y="598" fill="#8e8e93" font-size="11">Append-Only Audit Trail</text>

  <!-- Column 4: Outputs & Portability -->
  <rect x="930" y="90" width="230" height="580" rx="16" fill="#121215" stroke="#222228"/>
  <text x="954" y="124" fill="#0088ff" font-size="13" font-weight="700">4. OUTPUTS &amp; SELF-HOST</text>

  <rect x="950" y="168" width="190" height="110" rx="10" fill="#18181c" stroke="#27272f"/>
  <text x="966" y="198" fill="#f4f4f6" font-size="13" font-weight="600">Cited Memory Answers</text>
  <text x="966" y="220" fill="#8e8e93" font-size="11">Exact docId §ordinal</text>
  <text x="966" y="238" fill="#8e8e93" font-size="11">Paragraph Citations</text>

  <rect x="950" y="310" width="190" height="110" rx="10" fill="#18181c" stroke="#27272f"/>
  <text x="966" y="340" fill="#60a5fa" font-size="13" font-weight="600">Live No-Code Apps</text>
  <text x="966" y="362" fill="#8e8e93" font-size="11">Sales CRM &amp; Approvals</text>
  <text x="966" y="380" fill="#8e8e93" font-size="11">Inventory &amp; Stock Manager</text>
  <text x="966" y="398" fill="#8e8e93" font-size="11">Guest Link (/share/appId)</text>

  <rect x="950" y="452" width="190" height="130" rx="10" fill="#18181c" stroke="#10b981"/>
  <text x="966" y="482" fill="#10b981" font-size="13" font-weight="600">1-Click Portable .zip</text>
  <text x="966" y="504" fill="#8e8e93" font-size="11">• Decrypted vault/*.md</text>
  <text x="966" y="522" fill="#8e8e93" font-size="11">• apps/*/definition.json</text>
  <text x="966" y="540" fill="#8e8e93" font-size="11">• docker-compose.self-host</text>
  <text x="966" y="558" fill="#8e8e93" font-size="11">Zero Vendor Lock-In</text>

  <!-- Connectors -->
  <g stroke="#0088ff" stroke-width="2" fill="none">
    <line x1="280" y1="200" x2="330" y2="200"/>
    <line x1="280" y1="330" x2="330" y2="330"/>
    <line x1="280" y1="450" x2="330" y2="450"/>
    <line x1="580" y1="200" x2="630" y2="200"/>
    <line x1="580" y1="330" x2="630" y2="330"/>
    <line x1="580" y1="450" x2="630" y2="450"/>
    <line x1="880" y1="220" x2="930" y2="220"/>
    <line x1="880" y1="365" x2="930" y2="365"/>
    <line x1="880" y1="515" x2="930" y2="515"/>
  </g>
</svg>
